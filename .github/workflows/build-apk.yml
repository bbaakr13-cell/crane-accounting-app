name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project
          unzip -q "${{ steps.findzip.outputs.zip_file }}" -d project

      - name: Find package.json
        id: project
        shell: bash
        run: |
          PACKAGE=$(find project -type f -name "package.json" | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "package.json not found"
            exit 1
          fi
          DIR=$(dirname "$PACKAGE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --legacy-peer-deps
      - name: Fix fetchEquipment export
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "export { fetchEquipment } from './equipment';" >> src/lib/transactions.ts
      - name: Build web app
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Install Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
