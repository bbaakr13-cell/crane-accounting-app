name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find project
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            DIR=$(find . -maxdepth 3 -type f -name package.json -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)
            if [ -z "$DIR" ]; then
              echo "package.json not found"
              exit 1
            fi
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Build web app
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Install Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create Capacitor config
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -f capacitor.config.json capacitor.config.ts
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.crane.accounting",
            "appName": "Crane Accounting",
            "webDir": "dist"
          }
          EOF

      - name: Add Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crane-accounting-app
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
