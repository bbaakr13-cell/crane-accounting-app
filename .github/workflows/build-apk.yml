name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Find package.json
        run: |
          PACKAGE=$(find project -name package.json -not -path "*/node_modules/*" | head -1)
          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install
      - name: Fix fetchEquipment export
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "export { fetchEquipment } from './equipment';" >> src/lib/transactions.ts
      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.crane.accounting",
            "appName": "حساب كرينات",
            "webDir": "dist"
          }
          EOF

      - name: Add Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crane-accounting-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
