name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          ZIP=$(find . -maxdepth 1 -type f -name "*GitHub-Actions-APK*.zip" | head -1)
          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find project
        id: project
        shell: bash
        run: |
          if [ -f project/web/package.json ]; then
            echo "dir=project/web" >> "$GITHUB_OUTPUT"
          else
            echo "project/web/package.json not found"
            exit 1
          fi
      - name: Apply latest source changes
        run: |
          mkdir -p project/web/src
          cp -r src/. project/web/src/              

    

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Install PDF and sharing libraries
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install jspdf html2canvas @capacitor/filesystem @capacitor/share @capacitor/app
      - name: Fix fetchEquipment export
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "export { fetchEquipment } from './equipment';" >> src/lib/transactions.ts
      - name: Build web app
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Install Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create Capacitor config
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -f capacitor.config.json capacitor.config.ts
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.crane.accounting",
            "appName": "Crane Accounting",
            "webDir": "dist"
          }
          EOF

      - name: Add Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare signing key
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/crane-release.jks

      - name: Build signed APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign \
            --ks app/crane-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/release/crane-accounting-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose app/build/outputs/apk/release/crane-accounting-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crane-accounting-app-signed
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/release/crane-accounting-signed.apk
          if-no-files-found: error
